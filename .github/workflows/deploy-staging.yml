name: Deploy staging

# Builds the static export and deploys it to the assets-only Worker
# `company-map-staging` (ADR-0006, ADR-0007). Triggered by hand, or by
# `repository_dispatch` (type `rebuild`) from the request-rebuild Edge Function
# and the pipeline (P8-05).
#
# Needs repository secrets CLOUDFLARE_API_TOKEN (Account > Workers Scripts: Edit)
# and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [rebuild]
  # The nightly build (P8-05): picks up anything a debounced Publish now left waiting. 02:15 in India.
  schedule:
    - cron: "45 20 * * *"

# Deploys queue instead of cancelling each other.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  STAGING_URL: https://company-map-staging.company-map.workers.dev

jobs:
  deploy:
    name: Build and deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: code
    env:
      SITE_ENV: staging
      DEV_ROUTES: "on"
      NEXT_PUBLIC_SITE_URL: https://company-map-staging.company-map.workers.dev
      # Staging reads the staging Supabase project when the repository variables SUPABASE_URL and SUPABASE_ANON_KEY are set
      # (the anon key is public by design); until then it shows the committed synthetic sample (ADR-0010).
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      DATA_SOURCE: ${{ vars.SUPABASE_URL == '' && 'seed' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      # `postbuild` enforces the static-assets Free limits and the secret scan of out/.
      - run: npm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
      - name: Smoke-test staging
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.STAGING_URL }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=desktop
