name: Deploy staging

# Builds the static export and deploys it to the assets-only Worker
# `company-map-staging` (ADR-0006, ADR-0007). Triggered by hand, or by
# `repository_dispatch` (type `rebuild`) from the request-rebuild Edge Function
# and the pipeline (P8-05).
#
# Needs the `staging` GitHub environment with required reviewers, its variables, and its CLOUDFLARE_API_TOKEN
# (Account > Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID secrets: docs/deploy-environments.md.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [rebuild]
  # The nightly build (P8-05): picks up anything a debounced Publish now left waiting. 02:15 in India.
  schedule:
    - cron: "45 20 * * *"

# Deploys queue instead of cancelling each other.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    name: Build and deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Required reviewers on the `staging` environment hold every run (by hand, nightly, or Publish now) until a person
    # approves it, so nothing reaches the staging Worker without approval (CLAUDE.md, Hard rules).
    environment:
      name: staging
      url: ${{ vars.SITE_URL }}
    defaults:
      run:
        working-directory: code
    env:
      SITE_ENV: staging
      DEV_ROUTES: "on"
      # Every value below comes from the `staging` GitHub environment (docs/deploy-environments.md), never from repository
      # level: scripts/check-deploy-env.mts fails the run when one is missing or belongs to production. Staging shows the
      # synthetic sample only when that environment sets ALLOW_SYNTHETIC_DATA=true explicitly (ADR-0010).
      DEPLOY_ENV: ${{ vars.DEPLOY_ENV }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      OTHER_ENV_SUPABASE_PROJECT_REF: ${{ vars.OTHER_ENV_SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      # Public visitor-feature keys (DEP-1); check-deploy-env and the prebuild check fail the run when one is missing.
      NEXT_PUBLIC_GEOAPIFY_KEY: ${{ vars.GEOAPIFY_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      ALLOW_SYNTHETIC_DATA: ${{ vars.ALLOW_SYNTHETIC_DATA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: code/package-lock.json
      # Before installing or building anything: the staging configuration is complete and is not production's.
      - name: Check the staging configuration
        run: node scripts/check-deploy-env.mts staging
      - run: npm ci
      # `postbuild` enforces the static-assets Free limits and the secret scan of out/.
      - run: npm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
      - name: Smoke-test staging
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.SITE_URL }}
          # The deployment policy's target (lib/build-features.ts REQUIRED), from this environment's settings, not from the
          # build: a required feature the deployed build lacks fails the smoke test instead of being skipped.
          EXPECT_DEPLOY_TARGET: ${{ vars.ALLOW_SYNTHETIC_DATA == 'true' && 'staging-synthetic' || 'staging' }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=desktop
