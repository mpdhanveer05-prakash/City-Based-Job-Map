name: Monitor scheduled jobs

# P8-03. Hourly: fail when a scheduled job (feed sync, link check, the daily sweep, partition upkeep) has not finished in
# time. A failed run is the alert: GitHub emails the repository's watchers and shows a red badge. The check reads
# `missed_heartbeats()` through the pipeline login role.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    name: Missed-run check
    # Pushing this repository must not start automation by itself (owner, 8 Oct 2026): a scheduled or dispatched run does
    # nothing until the owner sets the repository variable AUTOMATION_ENABLED to true. A run started by hand always runs.
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: code
    env:
      PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the secret is set
        run: |
          if [ -z "$PIPELINE_DATABASE_URL" ]; then
            echo "PIPELINE_DATABASE_URL is not set: the monitor cannot look. See docs/security.md (Pipeline)." >&2
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: code/scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python -m scripts.pipeline.cli monitor
