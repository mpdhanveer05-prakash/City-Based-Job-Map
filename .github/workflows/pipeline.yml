name: Data pipeline

# P8-01 to P8-05. Every six hours: read the job feeds, check the apply links, and, if both ran, ask for a rebuild so the
# new data reaches the site. Needs the repository secret PIPELINE_DATABASE_URL (the pipeline login role, never the service
# role; see supabase/migrations/20261005150000_pipeline.sql for how to create it). Without it the run says so and stops.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Feeds, links, rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # repository_dispatch (the rebuild request) needs write access to repository contents.
      contents: write
    defaults:
      run:
        working-directory: code
    env:
      PIPELINE_DATABASE_URL: ${{ secrets.PIPELINE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the secret is set
        run: |
          if [ -z "$PIPELINE_DATABASE_URL" ]; then
            echo "PIPELINE_DATABASE_URL is not set: nothing to do. See docs/security.md (Pipeline)." >&2
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: code/scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Read the feeds
        run: python -m scripts.pipeline.cli sync
      - name: Check the apply links
        run: python -m scripts.pipeline.cli linkcheck --limit 800
      # Both finished without a failing exit code: ask for a rebuild (the deploy workflow queues builds, so a burst is one build).
      - name: Request a rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"rebuild"}'
