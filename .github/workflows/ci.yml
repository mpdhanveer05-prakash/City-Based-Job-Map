name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token; no job needs secrets (plan.md P1-04).
permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, types, unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The build reads its data from the committed synthetic sample (ADR-0010).
      - run: npm run build
        env:
          DATA_SOURCE: seed
      # Every dependency, tooling included, blocks on a high or critical finding unless
      # security/audit-exceptions.json holds a reviewed entry that has not expired (ADR-0019).
      - name: Dependency audit (blocking, reviewed exceptions only)
        run: npm run audit

  e2e:
    name: Playwright e2e + axe
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds and serves the app itself (playwright.config.ts webServer).
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            code/playwright-report/
            code/test-results/
          retention-days: 7

  database:
    name: Database migrations + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      # Postgres only (no API, Auth, or Studio), with every migration applied from scratch.
      - run: npx supabase db start
      # Re-applies every migration and loads the synthetic sample data (supabase/seed), which
      # tests/database/04_seed.test.sql checks. The other database tests empty the tables first.
      - run: npx supabase db reset
      - run: npx supabase test db
      # The TypeScript filter returns the same results as the SQL functions over the seeded data
      # (ADR-0006; tests/parity). Needs the database above.
      - run: npm run test:parity
      # The build-time dataset writer works against the same database and writes valid files.
      - run: npm run data -- --out "$RUNNER_TEMP/data" --require
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # The pipeline's Python tests, against the same database, as the pipeline role (scripts/pipeline/tests).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: code/scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python -m pytest scripts/pipeline/tests -q
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # The committed synthetic snapshot (what builds without a database read) is the seed's output.
      - run: npm run data -- --export-seed
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - run: git diff --exit-code -- supabase/seed/snapshots

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      # From the release's gitleaks_8.30.1_checksums.txt, checked 2026-09-30.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
