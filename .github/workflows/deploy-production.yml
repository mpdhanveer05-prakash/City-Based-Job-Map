name: Deploy production

# P9-05. Builds the real-data static export and deploys it to the production assets-only Worker `company-map`
# (ADR-0006, ADR-0007). THIS WORKFLOW HAS NEVER RUN. It exists so the release is a recorded, repeatable step, and it does
# nothing unless a person starts it by hand and types the confirmation phrase. There is no schedule and no dispatch trigger:
# the nightly and publish-now rebuilds go to staging. Production DATA is refreshed by refresh-production-data.yml (ADR-0025
# option C, accepted 8 Oct 2026), which rebuilds only the release/* tag this workflow creates after a successful release.
#
# CLAUDE.md, "Hard rules": do not deploy publicly without the owner's explicit authorization. The `confirm` input is that
# authorization being typed in; the `production` environment should also be set up with required reviewers in the
# repository settings, so a second person approves the run.
#
# Needs the `production` GitHub environment with required reviewers, its variables (SITE_URL, SUPABASE_URL,
# SUPABASE_ANON_KEY, SUPABASE_PROJECT_REF, ...) and its Cloudflare secrets: docs/deploy-environments.md.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy company-map to production" to confirm. The release checklist (docs/release-checklist.md) must be complete.'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers on this environment make the deploy a two-person step.
    environment: production
    # Write access only to push the release tag (ADR-0025 option C).
    permissions:
      contents: write
    defaults:
      run:
        working-directory: code
    env:
      # Every value comes from the `production` GitHub environment (docs/deploy-environments.md), never from repository
      # level; scripts/check-deploy-env.mts refuses a missing value, staging's project, or a staging site URL.
      DEPLOY_ENV: ${{ vars.DEPLOY_ENV }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      OTHER_ENV_SUPABASE_PROJECT_REF: ${{ vars.OTHER_ENV_SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      # Public visitor-feature keys (DEP-1); check-deploy-env and the prebuild check fail the run when one is missing.
      NEXT_PUBLIC_GEOAPIFY_KEY: ${{ vars.GEOAPIFY_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      # Read only so the check can refuse it: production never shows the synthetic sample.
      ALLOW_SYNTHETIC_DATA: ${{ vars.ALLOW_SYNTHETIC_DATA }}
      # Production reads the production database and never the synthetic sample: RELEASE_BUILD=1 refuses synthetic or mixed
      # data (ADR-0010), and DEV_ROUTES stays off so no /dev page is published.
      RELEASE_BUILD: "1"
      DATA_SOURCE: ""
    steps:
      - name: Check the confirmation phrase
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "deploy company-map to production" ]; then
            echo "The confirmation phrase did not match, so nothing was built or deployed." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: code/package-lock.json
      - name: Check the production configuration
        run: node scripts/check-deploy-env.mts production
      - run: npm ci
      # ADR-0022: the technical audit AND a human approval of every exception it relies on. An unapproved exception fails here.
      - name: Release audit gate (technical audit and exception approval)
        run: npm run audit -- --release
      # `prebuild` fails without real data; `postbuild` enforces the static-assets limits, writes the CSP, and scans out/.
      - run: npm run build
      - name: Launch gate (each city must pass)
        run: node scripts/launch-gate.mts --out ../launch-gate-report.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: launch-gate-report
          path: launch-gate-report.md
          if-no-files-found: ignore
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --message "release run ${{ github.run_id }} (${{ github.sha }})"
      - name: Smoke-test production
        run: bash scripts/smoke-production.sh "${{ vars.SITE_URL }}"
      # ADR-0025 option C: record what a person approved, so the data refresh rebuilds exactly this commit and never newer
      # code. The tag namespace release/* is protected by a repository ruleset (only this workflow's app may create it,
      # nobody may move or delete it): docs/deploy-environments.md.
      - name: Read the deployed Worker version
        id: version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deployments status --json > ../worker-status.json
          echo "id=$(node scripts/worker-version.mts ../worker-status.json)" >> "$GITHUB_OUTPUT"
      - name: Tag the approved release
        id: tag
        env:
          VERSION_ID: ${{ steps.version.outputs.id }}
        run: |
          tag=$(node scripts/release-tag.mts name --run "$GITHUB_RUN_NUMBER")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "Production release of $GITHUB_SHA" -m "Worker version: $VERSION_ID" -m "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          { echo "### Production release"; echo "Tag \`$tag\`, commit \`$GITHUB_SHA\`, Worker version \`$VERSION_ID\`."; } >> "$GITHUB_STEP_SUMMARY"
      # The rollback material for this release: the exact files deployed, their manifest, the launch-gate report and the
      # Worker version (ADR-0025 option C, point 1).
      - name: Keep the release files
        run: |
          mkdir -p ../release
          cp -r out ../release/out
          cp public/data/manifest.json ../launch-gate-report.md ../release/
          echo "${{ steps.version.outputs.id }}" > ../release/worker-version.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.run_number }}
          path: release
          retention-days: 90
